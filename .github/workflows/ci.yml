name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O shellcheck já vem na imagem do runner.
      - name: shellcheck
        run: make lint

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Instala o shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0

      - name: Verifica a formatação
        run: make fmt-check

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      - name: Suíte bats
        run: make test

      - name: Valida os exemplos de configuração
        run: make validate-examples

  image:
    name: Imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # O estágio de teste roda a suíte bats dentro da imagem, confirmando que
      # o script funciona com os utilitários do busybox e não só com os do GNU.
      - name: Build e testes dentro da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: false
