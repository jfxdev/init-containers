name: Release

on:
  push:
    # Releases por data: AAAA-MM-DD, com sufixo sequencial opcional para mais de
    # uma no mesmo dia (2026-10-20.1). Mais restrito que '*' porque este push
    # move a tag latest: uma tag qualquer substituiria a imagem estável.
    tags: ['20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publica a imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Confirma que a imagem passa nos próprios testes antes de publicar.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Testes dentro da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false

      # Segunda barreira: o filtro de tags acima é glob, não regex, então ainda
      # aceita formas como "2026-99-99-rascunho". Aqui a tag é conferida de
      # verdade antes de qualquer publicação.
      - name: Confere que a tag é uma data válida
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$REF_NAME" \
            | grep -qE '^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])(\.[0-9]+)?$'; then
            echo "::error::tag '$REF_NAME' não é uma release por data (AAAA-MM-DD[.N]); release abortado"
            exit 1
          fi

          # O regex acima aceita 2026-02-30: os dias válidos dependem do mês.
          DATE="${REF_NAME%%.*}"
          if [ "$(date -u -d "$DATE" +%Y-%m-%d 2>/dev/null)" != "$DATE" ]; then
            echo "::error::tag '$REF_NAME' não é uma data do calendário; release abortado"
            exit 1
          fi

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Sem tags móveis por major/minor: numa release por data não existe
          # linha de compatibilidade para elas acompanharem. Fica a tag datada,
          # imutável, e latest.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
